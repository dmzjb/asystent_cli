[project]
name = "asystent-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dmzjb", email = "kubadomowicz2@wp.pl" }
]
requires-python = ">=3.14"
dependencies = [
    "openai>=3.8.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
asystent-cli = "asystent_cli.main:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
